name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Check config schema is in sync
        run: python scripts/generate_conf_schema.py --check
      - name: Check architecture boundaries
        run: python scripts/check_architecture.py
      - name: Report architecture metrics
        run: python scripts/architecture_metrics.py --top 20

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check page JavaScript syntax
        shell: bash
        run: |
          find pages -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt bandit pip-audit
      - name: Run Bandit
        run: bandit -r backend mixins -q
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
