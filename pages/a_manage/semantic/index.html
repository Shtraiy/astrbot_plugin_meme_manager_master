<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表情索引</title>
    <link rel="stylesheet" href="./style.css?v=20260818-workspace-layout-1" />
  </head>
  <body>
    <header class="workspace-header">
      <div class="page-header-copy">
        <p class="eyebrow">Capture &amp; Catalog Workspace</p>
        <h1>表情索引</h1>
        <p class="subtitle">按分类查看表情缩略图；语义重索引会扫描整个资源包，旧索引会重新识别。</p>
      </div>
      <section class="toolbar panel" aria-label="资源包操作">
        <div class="toolbar-pack-control">
          <label for="pack">资源包</label>
          <select id="pack" aria-label="选择资源包"></select>
        </div>
        <div class="toolbar-actions">
          <button id="capture-refresh-button" type="button">刷新记录</button>
          <div class="export-mode-control" role="group" aria-label="导出方式">
            <span class="toolbar-control-label">导出方式</span>
            <label class="export-mode-option">
              <input type="radio" name="capture-export-mode" value="share" checked />
              <span>分享版</span>
            </label>
            <label class="export-mode-option">
              <input id="capture-export-backup" type="radio" name="capture-export-mode" value="backup" disabled />
              <span>自用备份</span>
            </label>
            <span id="capture-export-hint" class="transfer-hint"></span>
          </div>
          <button id="capture-export-button" type="button">导出当前资源包</button>
          <button id="capture-import-button" type="button">导入资源包</button>
        </div>
        <input id="capture-import-file" type="file" accept=".zip" hidden />
      </section>
    </header>

    <main class="layout">
      <section id="workspace-action-bar" class="workspace-action-bar panel" aria-label="索引操作">
        <div class="action-bar-copy">
          <span class="kicker">Workspace Actions</span>
          <strong>整理资源包里的表情</strong>
          <span>按分类查看，并处理待分类和重复项。</span>
        </div>
        <div class="reindex-control">
          <button id="capture-reindex-button" type="button">全量语义重索引</button>
        </div>
        <div class="selection-control" aria-live="polite">
          <button id="capture-selection-mode-button" type="button" aria-pressed="false">开启批量选择</button>
          <span id="capture-selection-summary">未开启批量选择</span>
          <button id="capture-select-indexed-page-button" type="button" hidden>选择当前页已整理项</button>
          <button id="capture-select-pending-button" type="button" hidden>选择当前视图待处理项</button>
          <button id="capture-select-index-button" type="button" class="primary" hidden disabled>选择索引</button>
          <button id="capture-clear-selection-button" type="button" hidden disabled>清空选择</button>
        </div>
        <button id="capture-index-button" type="button" class="primary">分类索引待处理项</button>
        <button id="capture-ignore-all-button" type="button" disabled>一键忽略全部待处理和待忽略</button>
      </section>

      <section id="capture-transfer-panel" class="transfer-panel" aria-live="polite">
        <div id="capture-import-preview" class="transfer-import-preview" hidden>
          <p id="capture-import-preview-name" class="transfer-hint"></p>
          <p id="capture-import-preview-meta" class="transfer-hint"></p>
          <label class="transfer-option">
            <input id="capture-import-set-default" type="checkbox" />
            <span>导入后设为默认</span>
          </label>
          <div class="transfer-actions">
            <button id="capture-import-confirm-button" type="button" class="primary">确认导入</button>
            <button id="capture-import-cancel-button" type="button">取消</button>
          </div>
        </div>
        <p id="capture-transfer-message" class="transfer-message"></p>
      </section>

      <div class="capture-progress-row">
        <div id="capture-reindex-progress" class="reindex-progress" hidden aria-live="polite">
          <div class="reindex-progress-heading">
            <span id="capture-reindex-progress-label">尚未开始重索引</span>
            <span id="capture-reindex-progress-count">0/0</span>
          </div>
          <progress id="capture-reindex-progress-bar" max="1" value="0">0%</progress>
        </div>
      </div>

      <p id="notice" class="notice" aria-live="polite"></p>

      <section id="capture-catalog-panel" class="catalog-panel panel" aria-label="表情目录">
        <div class="catalog-heading">
          <div>
            <span class="kicker">Emoji Catalog</span>
            <h2>表情目录</h2>
          </div>
          <span id="capture-items-count" class="badge">0 张</span>
        </div>
        <section id="capture-view-filters" class="category-filters" aria-label="按状态查看">
          <button type="button" class="category-filter active" data-capture-view="all" aria-pressed="true">全部表情</button>
          <button type="button" class="category-filter" data-capture-view="classified" aria-pressed="false">已分类</button>
          <button type="button" class="category-filter" data-capture-view="unclassified" aria-pressed="false">未分类</button>
        </section>
        <section id="capture-category-filters" class="category-filters" aria-label="按分类查看"></section>
        <article class="column catalog-column" aria-labelledby="capture-items-heading">
          <div class="column-heading">
            <div>
              <span class="kicker">当前视图</span>
              <h3 id="capture-items-heading" tabindex="-1">全部表情</h3>
            </div>
          </div>
          <div id="capture-items" class="cards"></div>
        </article>
        <nav id="capture-pagination" class="capture-pagination" aria-label="表情分页" hidden>
          <button id="capture-pagination-prev" type="button">上一页</button>
          <div id="capture-pagination-pages" class="capture-pagination-pages"></div>
          <button id="capture-pagination-next" type="button">下一页</button>
          <span id="capture-pagination-summary" class="capture-pagination-summary"></span>
        </nav>
      </section>
    </main>

    <div id="capture-confirm-mask" class="capture-confirm-mask hidden" aria-hidden="true">
      <div
        class="capture-confirm-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="capture-confirm-title"
        aria-describedby="capture-confirm-description"
      >
        <p class="kicker">操作确认</p>
        <h2 id="capture-confirm-title">请确认操作</h2>
        <p id="capture-confirm-description"></p>
        <div class="capture-confirm-actions">
          <button id="capture-confirm-cancel" type="button">取消</button>
          <button id="capture-confirm-confirm" type="button" class="primary">确认</button>
        </div>
      </div>
    </div>

    <div id="preview-mask" class="preview-mask hidden" aria-hidden="true">
      <button id="preview-close" type="button" aria-label="关闭预览">×</button>
      <img id="preview-image" alt="表情包预览" />
    </div>
    <script type="module" src="./script.js?v=20260818-workspace-layout-1"></script>
  </body>
</html>
