<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表情索引</title>
    <link rel="stylesheet" href="./style.css?v=20260812-unified-disposal-1" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <p class="eyebrow">Capture &amp; Catalog Workspace</p>
        <h1>表情索引</h1>
        <p class="subtitle">按分类查看表情缩略图；重索引只整理文件编号，不重复识别。</p>
      </div>
      <nav class="nav-actions" aria-label="页面导航">
        <a href="../index.html" data-nav-page="a_manage">返回表情管理</a>
        <a href="../settings/index.html" data-nav-page="settings">设置中心</a>
        <a href="../catalog/index.html" data-nav-page="catalog" data-nav-view="catalog">资源广场</a>
      </nav>
    </header>

    <main class="layout">
      <section class="toolbar panel">
        <label for="pack">资源包</label>
        <select id="pack" aria-label="选择资源包"></select>
        <button id="capture-refresh-button" type="button">刷新记录</button>
        <div class="reindex-control">
          <button id="capture-reindex-button" type="button">重索引</button>
        </div>
        <div class="selection-control" aria-live="polite">
          <button id="capture-selection-mode-button" type="button" aria-pressed="false">开启批量选择</button>
          <span id="capture-selection-summary">未开启批量选择</span>
          <button id="capture-select-indexed-page-button" type="button" hidden>选择当前页已整理项</button>
          <button id="capture-select-pending-button" type="button" hidden>选择当前视图待处理项</button>
          <button id="capture-clear-selection-button" type="button" hidden disabled>清空选择</button>
        </div>
        <button id="capture-index-button" type="button" class="primary">
          分类索引待处理项
        </button>
      </section>

      <div class="capture-progress-row">
        <div id="capture-reindex-progress" class="reindex-progress" hidden aria-live="polite">
          <div class="reindex-progress-heading">
            <span id="capture-reindex-progress-label">尚未开始重索引</span>
            <span id="capture-reindex-progress-count">0/0</span>
          </div>
          <progress id="capture-reindex-progress-bar" max="1" value="0">0%</progress>
        </div>
      </div>

      <p id="notice" class="notice" aria-live="polite"></p>
      <section id="capture-summary" class="summary" aria-live="polite"></section>
      <section id="capture-folders" class="folders" aria-live="polite"></section>
      <section id="capture-category-filters" class="category-filters" aria-label="按分类查看"></section>

      <section class="sections-stack">
        <article class="panel column" aria-labelledby="capture-indexed-heading">
          <div class="column-heading">
            <div>
              <span class="kicker">近期分类索引</span>
              <h2 id="capture-indexed-heading" tabindex="-1">已经整理好的表情</h2>
            </div>
            <span id="capture-indexed-count" class="badge">0</span>
          </div>
          <div id="capture-indexed-items" class="cards"></div>
        </article>
        <nav id="capture-pagination" class="capture-pagination panel" aria-label="已整理表情分页" hidden>
          <button id="capture-pagination-prev" type="button">上一页</button>
          <div id="capture-pagination-pages" class="capture-pagination-pages"></div>
          <button id="capture-pagination-next" type="button">下一页</button>
          <span id="capture-pagination-summary" class="capture-pagination-summary"></span>
        </nav>
        <article class="panel column pending-column">
          <div class="column-heading">
            <div>
              <span class="kicker">刚偷取</span>
              <h2>等待分类处理</h2>
            </div>
            <span id="capture-pending-count" class="badge warm">0</span>
          </div>
          <div id="capture-pending-items" class="cards"></div>
        </article>
      </section>
    </main>

    <div id="capture-confirm-mask" class="capture-confirm-mask hidden" aria-hidden="true">
      <div
        class="capture-confirm-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="capture-confirm-title"
        aria-describedby="capture-confirm-description"
      >
        <p class="kicker">操作确认</p>
        <h2 id="capture-confirm-title">请确认操作</h2>
        <p id="capture-confirm-description"></p>
        <div class="capture-confirm-actions">
          <button id="capture-confirm-cancel" type="button">取消</button>
          <button id="capture-confirm-confirm" type="button" class="primary">确认</button>
        </div>
      </div>
    </div>

    <div id="preview-mask" class="preview-mask hidden" aria-hidden="true">
      <button id="preview-close" type="button" aria-label="关闭预览">×</button>
      <img id="preview-image" alt="表情包预览" />
    </div>
    <script type="module" src="./script.js?v=20260812-contextual-batch-1"></script>
  </body>
</html>
