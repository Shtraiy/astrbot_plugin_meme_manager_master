name: meme_manager_master
display_name: 表情包管理大师
short_desc: 提供 AstrBot WebUI、视觉识别、情景选图、LLM 表情包发送工具与群聊表情包自动收集。
desc: 参考 AstrBot 原版 meme_manager，提供独立的多表情包运行时、WebUI 管理、视觉识别、情景判断选图和群聊自动收集；注册 send_meme LLM 工具供智能体按需发送本地表情包，不会抢占其他插件的生图或文件生成流程。
help: 功能：1. AstrBot WebUI 表情包管理 2. 多表情包与会话/人格选包 3. 视觉识别与情景判断选图 4. LLM 表情包发送工具（send_meme） 5. 群聊表情包自动收集 6. /表情管理大师 与 /偷取 命令
version: v2.5.0
author: Shtraiy
repo: https://github.com/Shtraiy/astrbot_plugin_meme_manager_master
astrbot_version: ">=4.5.7,<5"
